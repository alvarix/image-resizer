<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>ImageResizer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <header class="app-header">
          <div class="app-title-row">
            <span class="app-name">ImageResizer</span>
            <span id="app-version" class="app-version"></span>
          </div>
          <nav class="app-links">
            <button id="open-readme" class="btn-link" title="Open README.md">Readme</button>
            <button id="open-changelog" class="btn-link" title="Open CHANGELOG.md">Changelog</button>
          </nav>
        </header>

        <header class="sidebar-header">
          <h2>Presets</h2>
          <button id="add-preset" class="btn-icon" title="Add preset">+</button>
        </header>
        <ul id="preset-list" class="preset-list"></ul>

        <div class="runlog-section">
          <header class="runlog-header">
            <span>Recent runs</span>
          </header>
          <ul id="run-log" class="run-log"></ul>
        </div>
      </aside>

      <main class="main">
        <footer class="run-bar">
          <button id="run" class="btn-primary" disabled>Run</button>
          <button id="clear" class="btn-secondary" hidden>Remove All</button>
          <span id="status" class="status"></span>
        </footer>

        <div id="editor-panel" class="editor-panel" hidden></div>

        <section id="drop-zone" class="drop-zone">
          <div class="drop-inner">
            <div class="drop-icon">+</div>
            <p>
              Drop images here, or
              <button id="pick-files" class="btn-link">click to select</button>
            </p>
          </div>
        </section>

        <section id="file-list" class="file-list" hidden></section>
      </main>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
