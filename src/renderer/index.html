<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>ImageResizer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <header class="sidebar-header">
          <h2>Presets</h2>
          <button id="add-preset" class="btn-icon" title="Add preset" disabled>+</button>
        </header>
        <ul id="preset-list" class="preset-list">
          <li class="preset-item placeholder">PNG 4-color 1200</li>
          <li class="preset-item placeholder">WebP 70 1200</li>
        </ul>
        <p class="sidebar-note">(Preset editor coming next)</p>
      </aside>

      <main class="main">
        <section id="drop-zone" class="drop-zone">
          <div class="drop-inner">
            <div class="drop-icon">+</div>
            <p>
              Drop images here, or
              <button id="pick-files" class="btn-link">click to select</button>
            </p>
          </div>
        </section>

        <section id="file-list" class="file-list" hidden></section>

        <footer class="run-bar">
          <button id="run" class="btn-primary" disabled>Run</button>
          <button id="clear" class="btn-secondary" hidden>Clear</button>
          <span id="status" class="status"></span>
        </footer>
      </main>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
